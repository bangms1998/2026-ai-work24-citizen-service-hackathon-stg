<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>콘텐츠 관리자 | 고용24 공모전 TEST</title><link rel="stylesheet" href="styles.css"></head><body class="admin-body"><a class="skip" href="#adminMain">본문 바로가기</a><header class="admin-header"><div class="admin-brand"><img src="assets/work24-logo-transparent.png" alt="고용24"><span>공모전 콘텐츠 관리자</span></div><a href="index.html">공개사이트 보기 ↗</a></header><main id="adminMain" class="admin-shell"><div class="admin-alert"><strong>인증 없는 TEST 프로토타입</strong><br>현재 변경사항은 이 브라우저에만 저장됩니다. 공유 저장·실제 게시·관리자 인증·감사로그가 없으므로 운영용이 아닙니다.</div><div class="admin-title-row"><div><h1>콘텐츠 관리자</h1></div><span id="saveState" class="save-state">저장된 변경사항 없음</span></div><div class="admin-grid"><section class="admin-panel"><h2>홈 콘텐츠</h2><form id="contentForm"><div class="field"><label for="contestTitle">공모전 제목</label><input id="contestTitle" name="contestTitle" required maxlength="80" value="2026 AI 고용24 국민참여 서비스 발굴(온라인) 해커톤"><small>최대 80자 · 현재 임시 제목</small></div><div class="field"><label for="heroTitle">Hero 제목</label><input id="heroTitle" name="heroTitle" required maxlength="50" value="AI로 발견하는 더 나은 고용24 서비스"></div><div class="field"><label for="heroLead">Hero 설명</label><textarea id="heroLead" name="heroLead" required maxlength="240">국민의 경험과 아이디어로 고용24의 새로운 가능성을 찾습니다.</textarea></div><div class="field"><label for="contestState">접수 상태</label><select id="contestState" name="contestState"><option value="PREOPEN">사전안내 · PREOPEN</option><option value="OPEN">접수중 · OPEN</option><option value="CLOSED">마감 · CLOSED</option></select></div><div class="field"><label for="formUrl">Google Form URL</label><input id="formUrl" name="formUrl" type="url" placeholder="승인된 TEST Form URL만 입력"><small>OPEN 적용 시 URL 필수 · production Form은 staging에 연결하지 않습니다.</small></div><div class="field"><label for="noticeText">상단 안내 문구</label><input id="noticeText" name="noticeText" maxlength="100" value="공모요강·일정·시상 내용은 최종 확정 전입니다."></div></form><p id="adminStatus" class="admin-status" role="status" aria-live="polite"></p><div class="admin-actions"><button id="draftButton" type="button">임시저장</button><button id="previewButton" type="button">미리보기</button><button id="discardButton" type="button">변경 취소</button><button id="applyButtonAdmin" class="apply" type="button" disabled>변경사항 적용</button></div></section><aside class="admin-panel"><h2>버전 기록</h2><p>적용된 브라우저 로컬 버전을 확인하고 이전 내용으로 롤백합니다.</p><ul id="versionList" class="version-list"><li><span>적용된 버전 없음</span><button type="button" disabled>롤백</button></li></ul></aside></div></main><dialog id="previewDialog" class="preview-dialog" aria-labelledby="previewTitle"><div class="preview-content"><button id="closePreview" type="button" aria-label="미리보기 닫기">미리보기 닫기</button><p class="section-kicker">PREVIEW</p><h2 id="previewTitle"></h2><h3 id="previewHero"></h3><p id="previewLead"></p><p><strong id="previewState"></strong></p></div></dialog><script type="module" src="admin.js"></script></body></html>
